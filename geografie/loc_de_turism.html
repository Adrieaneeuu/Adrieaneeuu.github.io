<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucrări de mentenanță</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f4f9; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            padding: 50px; 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            max-width: 500px;
        }
        h1 { font-size: 32px; margin-bottom: 10px; color: #e67e22; }
        p { font-size: 18px; color: #666; line-height: 1.5; }
        .icon { font-size: 60px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🛠️</div>
    <h1>Mentenanță tehnică</h1>
    <p>Actualizăm site-ul pentru a vă oferi o experiență mai bună poate.<br>Revenim în curând!</p>
</div>

</body>
</html>
